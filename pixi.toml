[workspace]
name = "spotlight"
version = "0.1.0"
channels = ["conda-forge"]
# Every platform in ONE lock on purpose: scipy bundles its own pocketfft, so letting
# the laptop and the cluster resolve to different scipy VERSIONS would make the BaSiC
# DCT differ between where the port is tested and where it is run. All three resolve to
# numpy 1.26.4 / scipy 1.12.0; only the build strings differ, which is unavoidable.
#
# win-64 runs the LOCAL path only (`python -m spotlight run ...`). The cluster is always
# linux-64, so nothing under `scripts.py` or `bench/` has to work on Windows.
platforms = ["linux-64", "osx-arm64", "win-64"]

[tasks]
test = "python -m pytest tests -q"

[dependencies]
python = "==3.11"
# Pinned to match ~/basic2/pixi.toml, the environment the current pipeline runs in.
numpy = ">=1.26.4,<2"
scipy = "<1.13"
scikit-image = ">=0.25.2,<0.26"
tifffile = "*"
# zstd for the OME-TIFF output format; tifffile delegates every codec to imagecodecs.
imagecodecs = "*"
tomli-w = "*"
pytest = "*"

[pypi-dependencies]
tensorstore = ">=0.1.77, <0.2"
spotlight = { path = ".", editable = true }

